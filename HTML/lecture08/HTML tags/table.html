<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Table tag</h2>

    <table><caption>Employee Details</caption>
        <tr style="background-color: chartreuse;">
        <th>Employee Name</th>
        <th>ID</th>
        <th>Company Name</th>
        <th>Salary</th>
        </tr>
        <tr style="background-color: aqua;">
            <td>Ashish</td>
            <td>SDE</td>
            <td>CapGemini</td>
            <td>1.2</td>
        </tr>
        <tr style="background-color: aqua;">
            <td>Rahul</td>
            <td>Backend Dev</td>
            <td>Gemini</td>
            <td>1.6</td>
        </tr>
        <tr style="background-color: aqua;">
            <td>Shree</td>
            <td>FrontEnd dev</td>
            <td>TCS</td>
            <td>1.4</td>
        </tr>

    </table><hr>
    <h3>Rowspan-Colspan</h3>
    <table border="1">
        <tr>
            <th>Department</th>
            <th>Employee</th>
        </tr>
        <tr>
            <td  rowspan="2">IT</td>
            <td>Amit</td>
        </tr>
        <tr>
            <td>Sujay</td>
        </tr>
        <tr>
            <td rowspan="2">HR</td>
            <td>Kavya</td>
        </tr>
        <tr>
            <td>Rahul</td>
        </tr>
    </table><hr>

    <table border="1">
        <caption>Student Marks Report</caption>
        <tr>
            <th rowspan="2">Roll No</th>
            <th rowspan="2">Name</th>
            <th colspan="3">Subjects</th>
            <th rowspan="2">Total</th>
        </tr>
        <tr>
            <th>Maths</th>
            <th>Science</th>
            <th>English</th>
        </tr>
        <tr>
            <th>1</th>
            <th>Rahul</th>
            <th>80</th>
            <th>80</th>
        </tr>



    </table>
</body>
</html>
